<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Technician Login — PrintProTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --green-dark:   #0d3d2b;
            --green-mid:    #155c3e;
            --green-bright: #1e8a57;
            --green-light:  #2db870;
            --green-glow:   #3ddc8c;
            --gray-900:     #0f1410;
            --gray-800:     #1a2020;
            --gray-700:     #2a3530;
            --gray-500:     #556860;
            --gray-300:     #a8b8b0;
            --gray-100:     #e8f0ec;
            --white:        #f4fbf7;
            --accent:       #c8f5dc;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--gray-900);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── NOISE OVERLAY ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 999; opacity: .45;
        }

        /* Background gradient */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse 70% 60% at 80% 40%, rgba(30,138,87,.18) 0%, transparent 70%),
                        radial-gradient(ellipse 50% 80% at 10% 80%, rgba(13,61,43,.4) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 2rem;
        }

        .login-card {
            background: rgba(26,32,32,.9);
            border: 1px solid rgba(45,184,112,.2);
            border-radius: 18px;
            padding: 2.4rem;
            box-shadow: 0 24px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(61,220,140,.05);
            backdrop-filter: blur(12px);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            margin-bottom: 2.2rem;
            text-align: center;
        }

        .header-tag {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--green-glow);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .header-title {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
            color: var(--white);
        }

        .header-title span { color: var(--green-glow); }

        .header-sub {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            color: var(--gray-300);
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .alert {
            padding: 1rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
            border-left: 3px solid;
        }

        .alert.success { background: rgba(61,220,140,.1); color: var(--green-glow); border-left-color: var(--green-glow); }
        .alert.error { background: rgba(220,60,60,.1); color: #ff7979; border-left-color: #ff7979; }
        .alert.show { display: block; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.4rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--gray-300);
        }

        .input-wrap {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray-500);
            font-size: 1.1rem;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--gray-300);
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid rgba(45,184,112,.2);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            background: rgba(255,255,255,.04);
            color: var(--white);
            transition: border-color 0.2s, background 0.2s;
        }

        input::placeholder {
            color: var(--gray-500);
        }

        input:focus {
            outline: none;
            border-color: var(--green-light);
            background: rgba(255,255,255,.06);
            box-shadow: 0 0 0 3px rgba(45,184,112,.15);
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            font-size: 0.85rem;
        }

        .form-footer a {
            color: var(--green-glow);
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: var(--green-light);
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem 1.6rem;
            border-radius: 8px;
            border: none;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--green-bright), var(--green-light));
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 24px rgba(30,138,87,.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.2rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(30,138,87,.55);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .card-footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-300);
        }

        .card-footer a {
            color: var(--green-glow);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .card-footer a:hover {
            color: var(--green-light);
        }

        @media (max-width: 600px) {
            .login-container { padding: 1rem; }
            .login-card { padding: 1.8rem; }
            .header-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <p class="header-tag">🔧 Technician Access</p>
                <h1 class="header-title">Tech <span>Login</span></h1>
                <p class="header-sub">Access your maintenance dashboard</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" placeholder="Enter your username" required />
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a href="/password-reset?type=TECH" style="color: var(--green-glow); text-decoration: none; font-size: 0.85rem; text-transform: none; letter-spacing: normal; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--green-light)'" onmouseout="this.style.color='var(--green-glow)'">Forgot password?</a>
                    </div>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required style="padding-right: 2.5rem;" />
                        <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="totp" style="margin-bottom: 0;">2FA Code</label>
                        <a href="#" id="send2faBtn" style="color: var(--green-glow); text-decoration: none; font-size: 0.85rem; font-weight: 500; padding: 0.3rem 0.6rem; border: 1px solid var(--green-glow); border-radius: 4px; transition: all 0.2s;">Send Code</a>
                    </div>
                    <div class="input-wrap mt-2">
                        <input type="text" id="totp" name="totp" placeholder="Enter 6-digit code or leave blank if disabled" style="margin-top: 0.6rem;"/>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="card-footer">
                Don't have an account? <a href="/tech-register">Create one</a>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🙈"; // Hide icon
            } else {
                input.type = "password";
                icon.textContent = "👁️"; // Show icon
            }
        }

        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totp = document.getElementById('totp').value;

            try {
                const response = await fetch('/api/technician/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, otp: totp })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('techToken', data.token);
                        alertBox.className = 'alert success show';
                        alertBox.textContent = '✓ Login successful! Redirecting...';
                        setTimeout(() => window.location.href = '/tech-dashboard', 1500);
                    } else {
                        alertBox.className = 'alert success show';
                        alertBox.textContent = '✓ ' + data.message;
                        document.getElementById('send2faBtn').style.display = 'none';
                    }
                } else {
                    alertBox.className = 'alert error show';
                    alertBox.textContent = '✗ ' + (data.error || data.message || 'Login failed');
                }
            } catch (e) {
                alertBox.className = 'alert error show';
                alertBox.textContent = '✗ Connection error';
            }
        });

        // 2FA Code sending
        const send2faBtn = document.getElementById('send2faBtn');
        if (send2faBtn) {
            send2faBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    alertBox.className = 'alert error show';
                    alertBox.textContent = '✗ Please enter your username and password first';
                    return;
                }

                send2faBtn.textContent = 'Sending...';
                send2faBtn.style.pointerEvents = 'none';
                send2faBtn.style.opacity = '0.7';

                try {
                    const response = await fetch('/api/technician/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok && !data.token) {
                        alertBox.className = 'alert success show';
                        alertBox.textContent = '✓ ' + data.message;
                        send2faBtn.textContent = 'Sent Successfully';
                        send2faBtn.style.color = 'var(--green-light)';
                        send2faBtn.style.borderColor = 'var(--green-light)';

                        setTimeout(() => {
                            send2faBtn.textContent = 'Resend Code';
                            send2faBtn.style.pointerEvents = 'auto';
                            send2faBtn.style.opacity = '1';
                            send2faBtn.style.color = 'var(--green-glow)';
                            send2faBtn.style.borderColor = 'var(--green-glow)';
                        }, 5000);
                    } else if (response.ok && data.token) {
                        alertBox.className = 'alert success show';
                        alertBox.textContent = '✓ Successfully logged in without 2FA';
                        localStorage.setItem('techToken', data.token);
                        setTimeout(() => window.location.href = '/tech-dashboard', 1500);
                    } else {
                        alertBox.className = 'alert error show';
                        alertBox.textContent = '✗ ' + (data.error || 'Failed to send 2FA code');
                        send2faBtn.textContent = 'Send Code';
                        send2faBtn.style.pointerEvents = 'auto';
                        send2faBtn.style.opacity = '1';
                    }
                } catch (e) {
                    alertBox.className = 'alert error show';
                    alertBox.textContent = '✗ Connection error';
                    send2faBtn.textContent = 'Send Code';
                    send2faBtn.style.pointerEvents = 'auto';
                    send2faBtn.style.opacity = '1';
                }
            });
        }
    </script>
</body>
</html>
