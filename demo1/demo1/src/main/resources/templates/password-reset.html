<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Password Reset — PrintProTrack</title>

  <!-- Match fonts used by login/register pages -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --green-dark:   #0d3d2b;
      --green-mid:    #155c3e;
      --green-bright: #1e8a57;
      --green-light:  #2db870;
      --green-glow:   #3ddc8c;
      --gray-900:     #0f1410;
      --gray-800:     #1a2020;
      --gray-700:     #2a3530;
      --gray-500:     #556860;
      --gray-300:     #a8b8b0;
      --gray-100:     #e8f0ec;
      --white:        #f4fbf7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-900);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle background like login/register */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 80% 40%, rgba(30,138,87,.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 80% at 10% 80%, rgba(13,61,43,.4) 0%, transparent 60%);
      z-index: 0;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: rgba(26,32,32,.9);
      border: 1px solid rgba(45,184,112,.2);
      border-radius: 18px;
      padding: 2.2rem;
      box-shadow: 0 24px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(61,220,140,.05);
      backdrop-filter: blur(12px);
    }

    .header {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .header-tag {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-glow);
      margin-bottom: 0.6rem;
      font-weight: 600;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: var(--white);
    }

    h1 span { color: var(--green-glow); }

    .sub {
      font-size: 0.9rem;
      color: var(--gray-300);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    .alert {
      padding: 1rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      display: none;
      border-left: 3px solid;
    }
    .alert.show { display: block; }
    .alert.ok { background: rgba(61,220,140,.1); color: var(--green-glow); border-left-color: var(--green-glow); }
    .alert.err { background: rgba(220,60,60,.1); color: #ff7979; border-left-color: #ff7979; }

    form { display: flex; flex-direction: column; gap: 1rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gray-300);
      display: block;
      margin-bottom: 0.55rem;
    }

    .hint {
      margin-top: -0.25rem;
      font-size: 0.78rem;
      color: var(--gray-500);
      line-height: 1.3;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid rgba(45,184,112,.2);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      background: rgba(255,255,255,.04);
      color: var(--white);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: var(--gray-500); }

    input:focus {
      outline: none;
      border-color: var(--green-light);
      background: rgba(255,255,255,.06);
      box-shadow: 0 0 0 3px rgba(45,184,112,.15);
    }

    .twofa {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.95rem 1.2rem;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--green-bright), var(--green-light));
      color: #fff;
      box-shadow: 0 4px 24px rgba(30,138,87,.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(30,138,87,.55); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: rgba(255,255,255,.06);
      color: var(--white);
      border: 1px solid rgba(45,184,112,.25);
      padding: 0.85rem 1rem;
      text-transform: none;
      letter-spacing: normal;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
    }
    .btn-secondary:hover { border-color: rgba(45,184,112,.55); }

    .link {
      margin-top: 0.2rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--gray-300);
    }
    .link a { color: var(--green-glow); text-decoration: none; font-weight: 600; }
    .link a:hover { color: var(--green-light); }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .twofa { grid-template-columns: 1fr; }
      .btn-secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="header-tag">Secure recovery</div>
        <h1>Password <span>Reset</span></h1>
        <p class="sub">Enter your account details, request the verification code, then set a new password.</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="resetForm" novalidate>
        <!-- dropdown removed: user type is derived from URL query (?type=ADMIN/MANAGER/STAFF/TECH) -->

        <div class="grid">
          <div>
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter username" autocomplete="username" required />
          </div>
          <div>
            <label for="email">Registered email</label>
            <input id="email" type="email" placeholder="Enter email" autocomplete="email" required />
          </div>

          <div class="full">
            <label for="twoFactorCode">Verification code</label>
            <div class="twofa">
              <input id="twoFactorCode" type="text" placeholder="Enter 6-digit code" inputmode="numeric" autocomplete="one-time-code" required />
              <button class="btn btn-secondary" id="sendCodeBtn" type="button">Send code</button>
            </div>
          </div>

          <div>
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" placeholder="Min. 6 characters" autocomplete="new-password" required />
          </div>
          <div>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" placeholder="Re-enter new password" autocomplete="new-password" required />
          </div>
        </div>

        <button class="btn btn-primary" type="submit">Set password</button>

        <div class="link">
          <a id="backToLogin" href="#">Back to login</a>
        </div>
      </form>
    </div>
  </div>

<script>
  const alertEl = document.getElementById('alert');
  const form = document.getElementById('resetForm');
  const sendBtn = document.getElementById('sendCodeBtn');
  const backToLogin = document.getElementById('backToLogin');

  function showAlert(kind, msg){
    alertEl.className = 'alert show ' + (kind === 'ok' ? 'ok' : 'err');
    alertEl.textContent = msg;
  }

  function clearAlert(){
    alertEl.className = 'alert';
    alertEl.textContent = '';
  }

  function normalizeUserType(type){
    const t = (type || '').toUpperCase();
    if(['ADMIN','MANAGER','STAFF','TECH'].includes(t)) return t;
    return 'ADMIN';
  }

  function loginUrlFor(type){
    switch(normalizeUserType(type)){
      case 'ADMIN': return '/login';
      case 'MANAGER': return '/manager-login';
      case 'STAFF': return '/staff-login';
      case 'TECH': return '/tech-login';
      default: return '/login';
    }
  }

  // Derive userType from query string (each login page already passes the right type)
  const params = new URLSearchParams(window.location.search);
  const userType = normalizeUserType(params.get('type'));
  backToLogin.href = loginUrlFor(userType);

  sendBtn.addEventListener('click', async ()=>{
    clearAlert();

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();

    if(!username || !email){
      showAlert('err','Enter username and registered email first.');
      return;
    }

    sendBtn.textContent = 'Sending...';
    sendBtn.style.pointerEvents = 'none';
    sendBtn.style.opacity = '0.7';

    try{
      const res = await fetch('/api/password-reset/send-code',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({userType, username, email})
      });
      const data = await res.json();
      if(res.ok){
        showAlert('ok', (data.message || 'Code sent') + (data.email ? (' to ' + data.email) : ''));
        sendBtn.textContent = 'Sent Successfully';
        sendBtn.style.color = 'var(--green-light)';
        sendBtn.style.borderColor = 'var(--green-light)';

        setTimeout(() => {
            sendBtn.textContent = 'Resend Code';
            sendBtn.style.pointerEvents = 'auto';
            sendBtn.style.opacity = '1';
            sendBtn.style.color = '';
            sendBtn.style.borderColor = '';
        }, 5000);
      } else {
        showAlert('err', data.error || data.message || 'Failed to send code');
        sendBtn.textContent = 'Send code';
        sendBtn.style.pointerEvents = 'auto';
        sendBtn.style.opacity = '1';
      }
    }catch(e){
      showAlert('err','Connection error');
      sendBtn.textContent = 'Send code';
      sendBtn.style.pointerEvents = 'auto';
      sendBtn.style.opacity = '1';
    }
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    clearAlert();

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const twoFactorCode = document.getElementById('twoFactorCode').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(newPassword.length < 6){
      showAlert('err','Password must be at least 6 characters.');
      return;
    }

    if(newPassword !== confirmPassword){
      showAlert('err','New password and confirm password do not match.');
      return;
    }

    try{
      const res = await fetch('/api/password-reset',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({userType, username, email, twoFactorCode, newPassword, confirmPassword})
      });
      const data = await res.json();
      if(res.ok){
        showAlert('ok', data.message || 'Password updated. Redirecting...');
        setTimeout(()=> window.location.href = loginUrlFor(userType), 1400);
      } else {
        showAlert('err', data.message || data.error || 'Password reset failed');
      }
    }catch(e){
      showAlert('err','Connection error');
    }
  });
</script>
</body>
</html>
